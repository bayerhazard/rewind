name: Publish Image
on:
  push:
    branches: [master, main]
    paths: ['Dockerfile', 'Dockerfile.new', 'backup-manager.py', 'backup-manager.html', 'logo.png', 'olares-config-export.sh', 'olares-db-export.sh', 'rewind/Chart.yaml', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract chart version
        id: version
        run: |
          VERSION=$(grep '^version:' rewind/Chart.yaml | awk '{print $2}' | tr -d "'")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Rewind chart version: $VERSION"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bayerhazard/rewind:${{ steps.version.outputs.version }}
            ghcr.io/bayerhazard/rewind:ci-${{ github.sha }}
            ghcr.io/bayerhazard/rewind:ci-latest
