olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  rewind: 1

metadata:
  name: rewind
  appid: rewind
  icon: https://github.com/bayerhazard/rewind/raw/master/logo.png
  title: Rewind
  version: 1.0.12
  categories:
    - Utilities
    - Developer Tools
  description: Backup Solution for Olares One
  fullDescription: >
    Rewind complements the Olares standard backup by exporting app settings,
    network configs, VPN settings, integration accounts, GPU/compute settings,
    and PostgreSQL database dumps.
    All exports are written to /Data/Backup/
  upgradeDescription: 'v1.0.12: Restore auf App-Einstellungen (Einzel-App-Auswahl), DB-Export entfernt, Export reduziert (ohne Network/VPN/Search/Status); Config-Exporte-Liste in UI gefixt (korrekte API-Endpoints); Config-Export-Fix (asynchron, kein 180s-Timeout); UI-Ueberarbeitung (Logo, Konfiguration-Tab, Uebersicht-Redesign); (1.0.6 chart) re-sync fix; pre-provisioned olares-cli profile (keychain + config.json) so the app connects to Olares out of the box.'
  developer: Aimighty
  website: ''
  sourceCode: https://github.com/bayerhazard/rewind
  locale:
    - en-US
  supportArch:
    - amd64

spec:
  versionName: '1.0.12'
  fullDescription: >
    Rewind complements the Olares standard backup by exporting app settings,
    network configs, VPN settings, integration accounts, GPU/compute settings,
    and PostgreSQL database dumps.
    All exports are written to /Data/Backup/
  upgradeDescription: 'v1.0.12: Restore auf App-Einstellungen (Einzel-App-Auswahl), DB-Export entfernt, Export reduziert (ohne Network/VPN/Search/Status); Config-Exporte-Liste in UI gefixt (korrekte API-Endpoints); Config-Export-Fix (asynchron, kein 180s-Timeout); UI-Ueberarbeitung (Logo, Konfiguration-Tab, Uebersicht-Redesign); (1.0.6 chart) re-sync fix; pre-provisioned olares-cli profile (keychain + config.json) so the app connects to Olares out of the box.'
  developer: Aimighty
  website: ''
  sourceCode: https://github.com/bayerhazard/rewind
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: '1'
  limitedCpu: '2'
  requiredMemory: 512Mi
  limitedMemory: 1Gi
  requiredDisk: 10Gi
  requiredGpu: '0'

entrances:
  - name: rewind
    port: 8765
    host: rewind
    title: Rewind
    authLevel: internal
    invisible: false
    openMethod: window

permission: {}

envs: []

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
