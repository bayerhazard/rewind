olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  rewind: 1

metadata:
  name: rewind
  appid: rewind
  icon: ''
  title: Rewind
  version: 1.0.0
  categories:
    - Utilities
    - Developer Tools
  description: Backup supplement for Olares One — exports settings, databases, and system configs
  fullDescription: >
    Rewind complements the Olares standard backup by exporting app settings,
    network configs, VPN settings, integration accounts, GPU/compute settings,
    and PostgreSQL database dumps. All exports are written to /Data/Backup/
    and automatically included in the Olares "Backup Data" plan.
  upgradeDescription: 'v1.0.0: Initial release.'
  developer: Aimighty
  website: ''
  sourceCode: https://github.com/bayerhazard/rewind
  locale: en-US
  supportArch:
    - amd64
  requiredCpu: '1'
  limitedCpu: '2'
  requiredMemory: 512Mi
  limitedMemory: 1Gi
  requiredDisk: 10Gi
  requiredGpu: '0'

permission: []

envs: []

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
