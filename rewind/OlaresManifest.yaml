olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  rewind: 1

metadata:
  name: rewind
  appid: rewind
  icon: https://github.com/bayerhazard/rewind/raw/master/logo.png
  title: Rewind
  version: '26.08.1'
  categories:
    - Utilities
  description: Configuration-level backup & restore for Olares One
  fullDescription: >
    Rewind complements the Olares standard backup by exporting app settings,
    network configs, VPN settings, integration accounts, GPU/compute settings,
    and PostgreSQL database dumps.
    All exports are written to /Data/Backup/
  upgradeDescription: "v26.08.1: Unified naming — category Utilities, English descriptions. Built for Olares 1.12.6. v1.3.15: Letzter DB-Export zeigt echten Voll-DB-Dump; v1.3.14: GUI aufgeraeumt; v1.3.12: konfigurierbare Aufbewahrung; v1.3.8-11: DB-Backup (Voll-DB + kvrocks); v1.3.4/5/6/7: Design + Profil + no-cache; v1.3.3: User-Profil-Backup."
  developer: Aimighty
  website: ''
  sourceCode: https://github.com/bayerhazard/rewind
  locale:
    - en-US
  supportArch:
    - amd64

spec:
  versionName: '26.08.1'
  fullDescription: >
    Rewind complements the Olares standard backup by exporting app settings,
    network configs, VPN settings, integration accounts, GPU/compute settings,
    and PostgreSQL database dumps.
    All exports are written to /Data/Backup/
  upgradeDescription: "v26.08.1: Unified naming — category Utilities, English descriptions. Built for Olares 1.12.6. v1.3.15: Letzter DB-Export zeigt echten Voll-DB-Dump; v1.3.14: GUI aufgeraeumt; v1.3.12: konfigurierbare Aufbewahrung; v1.3.8-11: DB-Backup (Voll-DB + kvrocks); v1.3.4/5/6/7: Design + Profil + no-cache; v1.3.3: User-Profil-Backup."
  developer: Aimighty
  website: ''
  sourceCode: https://github.com/bayerhazard/rewind
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: '1'
  limitedCpu: '2'
  requiredMemory: 512Mi
  limitedMemory: 1Gi
  requiredDisk: 10Gi
  requiredGpu: '0'

entrances:
  - name: rewind
    port: 8765
    host: rewind
    title: Rewind
    authLevel: internal
    invisible: false
    openMethod: window

permission: {}

envs: []

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
